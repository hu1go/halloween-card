<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Halloween!</title>

    <style>
        body {
            background-color: #17121f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: orange;
            font-size: 45px;
        }

        p {
            font-size: 20px;
        }

        .card {
            background-color: #30213d;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
            border: 2px solid orange;
        }

        button {
            background-color: orange;
            color: black;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: darkorange;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🎃 Happy Halloween! 👻</h1>

        <p>Trick or treat!</p>

        <p>Hope your Halloween is full of candy, spooky fun and scary surprises!</p>

        <button onclick="alert('BOO! 👻 Happy Halloween!')">
            Click if you dare!
        </button>
    </div>

</body>
</html>
